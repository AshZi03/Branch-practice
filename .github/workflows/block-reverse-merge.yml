name: Block Reverse Merge

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  prevent_reverse_merge:
    runs-on: ubuntu-latest

    steps:
      - name: Validate release/hotfix version direction
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.ref }}"
          HEAD="${{ github.event.pull_request.head.ref }}"

          echo "Base branch: $BASE"
          echo "Head branch: $HEAD"

          # Detect valid versioned branches:
          is_version_branch() {
            [[ "$1" =~ ^release/release-[0-9]+\.[0-9]+(\.P[0-9]+)?$ ]] || \
            [[ "$1" =~ ^hotfix/release-[0-9]+\.[0-9]+(\.P[0-9]+)?$ ]]
          }

          # Only check if BOTH branches are version-based release/hotfix branches
          if is_version_branch "$BASE" && is_version_branch "$HEAD"; then
            echo "Both branches are versioned release/hotfix branches."

            # Extract version patterns such as 11.2 OR 11.2.P1
            extract_version() {
              echo "$1" | sed -E 's#(release/|hotfix/)release-([0-9]+\.[0-9]+(\.P[0-9]+)?)#\2#'
            }

            BASE_VER=$(extract_version "$BASE")
            HEAD_VER=$(extract_version "$HEAD")

            echo "Extracted Base version: $BASE_VER"
            echo "Extracted Head version: $HEAD_VER"

            # Normalize missing patch (11.2 → 11.2.P0)
            normalize() {
              local ver="$1"
              [[ "$ver" != *".P"* ]] && ver="${ver}.P0"
              echo "$ver"
            }

            BASE_NORM=$(normalize "$BASE_VER")
            HEAD_NORM=$(normalize "$HEAD_VER")

            echo "Normalized Base: $BASE_NORM"
            echo "Normalized Head: $HEAD_NORM"

            # Split into Major Minor Patch
            parse_version() {
              local ver="$1"
              major=$(echo "$ver" | cut -d'.' -f1)
              minor=$(echo "$ver" | cut -d'.' -f2)
              patch=$(echo "$ver" | cut -d'.' -f3 | sed 's/P//')
              echo "$major $minor $patch"
            }

            read BASE_MAJOR BASE_MINOR BASE_PATCH <<< $(parse_version "$BASE_NORM")
            read HEAD_MAJOR HEAD_MINOR HEAD_PATCH <<< $(parse_version "$HEAD_NORM")

            echo "Parsed BASE → $BASE_MAJOR.$BASE_MINOR.P$BASE_PATCH"
            echo "Parsed HEAD → $HEAD_MAJOR.$HEAD_MINOR.P$HEAD_PATCH"

            # ---- REVERSE MERGE CHECK ----
            if (( HEAD_MAJOR > BASE_MAJOR )) ||
               (( HEAD_MAJOR == BASE_MAJOR && HEAD_MINOR > BASE_MINOR )) ||
               (( HEAD_MAJOR == BASE_MAJOR && HEAD_MINOR == BASE_MINOR && HEAD_PATCH > BASE_PATCH )); then
              
              echo "❌ ERROR: Reverse merge detected!"
              echo "Attempted to merge NEWER ($HEAD_VER) into OLDER ($BASE_VER)."
              exit 1
            fi

            echo "✔ Allowed merge (forward or equal version)."
          else
            echo "Skipping: One or both branches are not versioned release/hotfix branches."
          fi
